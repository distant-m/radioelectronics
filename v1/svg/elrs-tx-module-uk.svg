<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1100" font-family="IBM Plex Sans, Arial, sans-serif">
<style>
.t{fill:#1a231f}.m{fill:#5a6760}.ln{stroke:#5a6760}.ar{stroke:#1d6b47;fill:none}.ah{fill:#1d6b47}.rx{stroke:#a85a17;fill:none}.rh{fill:#a85a17}.bar{stroke:#8ff0bd;fill:none}.bah{fill:#8ff0bd}.brx{stroke:#ffb35c;fill:none}.brh{fill:#ffb35c}
</style><rect x="0" y="0" width="420" height="1100" rx="12" fill="#f4f6f4"/>
<text x="20" y="30" class="t" font-size="22" font-weight="700">Зовні</text>
<g transform="translate(-52,12) scale(0.8)"><!-- T antenna (dipole) -->
<g stroke="#3a3f3c" stroke-linecap="round">
  <line x1="95" y1="98" x2="295" y2="98" stroke-width="7"/>
  <line x1="195" y1="98" x2="195" y2="190" stroke-width="6"/>
</g>
<rect x="180" y="88" width="30" height="20" rx="4" fill="#2b2f2d"/>
<circle cx="95" cy="98" r="5" fill="#2b2f2d"/><circle cx="295" cy="98" r="5" fill="#2b2f2d"/>
<!-- SMA connector -->
<rect x="185" y="190" width="20" height="16" fill="#c9a24a" stroke="#8a6a1c"/>
<rect x="182" y="206" width="26" height="14" fill="#d9b45a" stroke="#8a6a1c"/>

<!-- module body -->
<rect x="90" y="220" width="210" height="250" rx="14" fill="#c8ccd0" stroke="#8b9197" stroke-width="2"/>
<!-- vents -->
<g stroke="#6e747a" stroke-width="5" stroke-linecap="round">
  <line x1="115" y1="250" x2="135" y2="240"/><line x1="115" y1="265" x2="135" y2="255"/><line x1="115" y1="280" x2="135" y2="270"/>
  <line x1="255" y1="250" x2="275" y2="240"/><line x1="255" y1="265" x2="275" y2="255"/><line x1="255" y1="280" x2="275" y2="270"/>
</g>
<!-- fan -->
<circle cx="195" cy="360" r="62" fill="#2b2f2d"/>
<circle cx="195" cy="360" r="54" fill="#3a3f3c"/>
<g fill="#5a6066">
  <path d="M195,360 q10,-40 40,-38 q-14,22 -40,38z"/>
  <path d="M195,360 q40,10 38,40 q-22,-14 -38,-40z"/>
  <path d="M195,360 q-10,40 -40,38 q14,-22 40,-38z"/>
  <path d="M195,360 q-40,-10 -38,-40 q22,14 38,40z"/>
</g>
<circle cx="195" cy="360" r="14" fill="#2b2f2d"/>
<!-- status LED -->
<circle cx="268" cy="440" r="6" fill="#d24a3a"/>
<!-- bay pins -->
<g fill="#d9b45a" stroke="#8a6a1c">
  <rect x="140" y="470" width="10" height="22"/><rect x="160" y="470" width="10" height="22"/><rect x="180" y="470" width="10" height="22"/><rect x="200" y="470" width="10" height="22"/><rect x="220" y="470" width="10" height="22"/>
</g>

</g>
<line x1="188" y1="90" x2="206" y2="73" class="ln" stroke-width="1.2"/>
<text x="212" y="78" class="t" font-size="17" font-weight="600">Антена (диполь)</text>
<line x1="114" y1="177" x2="206" y2="165" class="ln" stroke-width="1.2"/>
<text x="212" y="170" class="t" font-size="17" font-weight="600">Роз’єм SMA</text>
<line x1="154" y1="300" x2="206" y2="277" class="ln" stroke-width="1.2"/>
<text x="212" y="282" class="t" font-size="17" font-weight="600">Вентилятор</text>
<text x="212" y="301" class="m" font-size="15">підсилювач гріється</text>
<line x1="168" y1="364" x2="206" y2="355" class="ln" stroke-width="1.2"/>
<text x="212" y="360" class="t" font-size="17" font-weight="600">Індикатор стану</text>
<line x1="134" y1="406" x2="206" y2="425" class="ln" stroke-width="1.2"/>
<text x="212" y="430" class="t" font-size="17" font-weight="600">Контакти до пульта</text>
<text x="212" y="449" class="m" font-size="15">живлення + сигнал CRSF</text>
<text x="20" y="470" class="t" font-size="22" font-weight="700">Всередині</text>
<g transform="translate(-545,430)">
<rect x="560" y="60" width="370" height="440" rx="10" fill="#1f5c3f" stroke="#164a32" stroke-width="2"/>
<rect x="580" y="380" width="140" height="70" rx="4" fill="#1b1d1c"/><text x="650" y="411" fill="#e9ece9" font-weight="600" font-size="15" text-anchor="middle">MCU (ESP32)</text><text x="650" y="429" fill="#b9c2bd" font-size="13.5" text-anchor="middle">мікроконтролер</text>
<rect x="580" y="250" width="140" height="80" rx="4" fill="#1b1d1c"/><text x="650" y="278" fill="#e9ece9" font-weight="600" font-size="15" text-anchor="middle">LoRa</text><text x="650" y="296" fill="#b9c2bd" font-size="13.5" text-anchor="middle">SX127x · 900 MHz</text><text x="650" y="314" fill="#b9c2bd" font-size="13.5" text-anchor="middle">SX128x · 2.4 GHz</text>
<rect x="610" y="190" width="60" height="34" rx="3" fill="#bfc4c8" stroke="#7f868c"/><text x="640" y="212" fill="#1a231f" font-weight="600" font-size="15" text-anchor="middle">TCXO</text>
<rect x="760" y="296" width="150" height="62" rx="4" fill="#1b1d1c"/><text x="835" y="314" fill="#e9ece9" font-weight="600" font-size="15" text-anchor="middle">PA</text><text x="835" y="332" fill="#b9c2bd" font-size="13.5" text-anchor="middle">підсилювач</text><text x="835" y="350" fill="#b9c2bd" font-size="13.5" text-anchor="middle">потужності</text>
<rect x="760" y="204" width="150" height="62" rx="4" fill="#1b1d1c"/><text x="835" y="222" fill="#e9ece9" font-weight="600" font-size="15" text-anchor="middle">LNA</text><text x="835" y="240" fill="#b9c2bd" font-size="13.5" text-anchor="middle">малошумний</text><text x="835" y="258" fill="#b9c2bd" font-size="13.5" text-anchor="middle">підсилювач</text>
<rect x="780" y="116" width="100" height="48" rx="4" fill="#1b1d1c"/><text x="830" y="136" fill="#e9ece9" font-weight="600" font-size="15" text-anchor="middle">RF switch</text><text x="830" y="154" fill="#b9c2bd" font-size="13.5" text-anchor="middle">перемикач</text>
<rect x="815" y="70" width="30" height="22" fill="#d9b45a" stroke="#8a6a1c"/>
<rect x="770" y="396" width="130" height="56" rx="4" fill="#3a3f3c"/><text x="835" y="420" fill="#e9ece9" font-weight="600" font-size="15" text-anchor="middle">DC-DC</text><text x="835" y="438" fill="#b9c2bd" font-size="13.5" text-anchor="middle">живлення 3,3 В</text>
<defs>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" class="ah"/></marker>
  <marker id="bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" class="bah"/></marker>
  <marker id="bo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" class="brh"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" class="rh"/></marker>
</defs>
<path d="M650,380 L650,332" class="bar" stroke-width="2.5" marker-end="url(#bg)"/>
<path d="M722,305 L758,320" class="bar" stroke-width="2.5" marker-end="url(#bg)"/>
<path d="M912,310 C926,250 920,180 882,146" class="bar" stroke-width="2.5" marker-end="url(#bg)"/>
<path d="M830,116 L830,94" class="bar" stroke-width="2.5" marker-end="url(#bg)"/>
<path d="M805,166 L805,202" class="brx" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#bo)"/>
<path d="M758,240 L724,262" class="brx" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#bo)"/>
<line x1="640" y1="224" x2="640" y2="250" stroke="#bfc4c8" stroke-width="2"/>
<path d="M650,540 L650,452" class="ar" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="662" y="532" class="m" font-size="15">сигнал CRSF від пульта</text>
</g>
<line x1="20" y1="1005" x2="56" y2="1005" class="ar" stroke-width="3"/>
<text x="66" y="1010" class="t" font-size="16" font-weight="600">Команди</text>
<text x="66" y="1029" class="m" font-size="15">пульт → МК → LoRa → підсилювач → антена</text>
<line x1="20" y1="1055" x2="56" y2="1055" class="rx" stroke-width="3" stroke-dasharray="6 4"/>
<text x="66" y="1060" class="t" font-size="16" font-weight="600">Телеметрія</text>
<text x="66" y="1079" class="m" font-size="15">антена → малошумний підсилювач → LoRa</text>
</svg>